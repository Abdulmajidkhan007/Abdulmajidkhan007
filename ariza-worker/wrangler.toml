# Cloudflare Worker: saytdagi ariza formasini qabul qilib, bot orqali guruhga yuboradi.
# Token bu yerda YO'Q — `npx wrangler secret put TELEGRAM_BOT_TOKEN` bilan qo'yiladi.
name = "ariza-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Ruxsat etilgan saytlar (JSON: origin -> xabar sarlavhasidagi nom). Origin header shu
# ro'yxatdan tekshiriladi va manba nomi ham shu yerdan olinadi (CORS ham shundan hosil bo'ladi).
# Yangi sayt qo'shish = shu yerga bitta qator. Token YO'Q — u Worker secret'larida.
SITES = '''
{
  "https://abdulmajidkhan007.github.io": "Xizmatlar sayti",
  "https://nafidastur.uz": "Xizmatlar sayti",
  "https://www.nafidastur.uz": "Xizmatlar sayti",
  "https://abdulmajidkhan-portfolio.web.app": "Portfolio",
  "https://abdulmajidkhan-portfolio.firebaseapp.com": "Portfolio"
}
'''
