# ariza-worker/ ni Cloudflare'ga joylaydi. Bot tokeni va guruh ID si GitHub Secrets'da,
# deploy paytida Worker secret'iga o'tkaziladi — saytga ham, repoga ham tushmaydi.
# Kerakli secret'lar (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Ixtiyoriy repo VARIABLE (Settings → Secrets and variables → Actions → Variables):
#   LEAD_BUTTONS=on — arizalarga holat tugmalari + Telegram webhook (ariza-worker/README.md ga qarang).
#   Webhook shu botning polling'ini to'xtatadi, shuning uchun faqat egasi "on" qo'yganda ulanadi.
name: Ariza worker (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["ariza-worker/**", ".github/workflows/ariza-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret'lar borligini tekshirish
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$TG_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TG_CHAT" ] && missing="$missing TELEGRAM_CHAT_ID"
          # Secret'lar hali qo'yilmagan bo'lsa push'da qizil bo'lmasin — deploy o'tkazib yuboriladi.
          if [ -n "$missing" ]; then
            echo "::warning::GitHub Secrets'da yo'q:$missing — deploy o'tkazib yuborildi"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        if: steps.check.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ariza-worker
          vars: |
            LEAD_BUTTONS
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
        env:
          LEAD_BUTTONS: ${{ vars.LEAD_BUTTONS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Webhook holati har deploy'da chiqadi (o'zgartirmaydi). Boshqa joyda polling bo'lsa,
      # `url` bo'sh bo'ladi va getUpdates ishlayveradi.
      - name: Telegram getWebhookInfo
        if: steps.check.outputs.ok == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS "https://api.telegram.org/bot${TG_TOKEN}/getWebhookInfo" | jq '{url: .result.url, pending: .result.pending_update_count, allowed_updates: .result.allowed_updates, last_error: .result.last_error_message}'
      # FAQAT repo variable LEAD_BUTTONS=on bo'lsa. secret_token = HMAC-SHA256(kalit=bot tokeni,
      # matn="ariza-worker/tg-webhook") — Worker (src/leads.ts) xuddi shuni hisoblaydi.
      - name: Telegram setWebhook (LEAD_BUTTONS=on bo'lsa)
        if: steps.check.outputs.ok == 'true' && vars.LEAD_BUTTONS == 'on'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          [ -n "$WORKER_URL" ] || { echo "::error::deployment-url yo'q — webhook ulanmadi"; exit 1; }
          secret=$(printf '%s' 'ariza-worker/tg-webhook' | openssl dgst -sha256 -hmac "$TG_TOKEN" -hex | awk '{print $NF}')
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL%/}/tg" \
            --data-urlencode "secret_token=${secret}" \
            --data-urlencode 'allowed_updates=["callback_query"]' \
            --data-urlencode 'drop_pending_updates=false' | jq -e '.ok == true'
